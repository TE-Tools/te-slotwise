# TE-Slotwise auf Cloudflare Pages (Adresse: https://te-slotwise.pages.dev).
# Veröffentlichen: npm run deploy (wendet zuerst neue Datenbank-Migrationen an).
# Geheimnisse und persönliche Angaben (BREVO_API_KEY, MAIL_FROM, ADMIN_EMAILS) NICHT hier eintragen, sondern mit:
#   npx wrangler pages secret put BREVO_API_KEY --project-name te-slotwise

name = "te-slotwise"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "te-slotwise-db"
database_id = "9dba001e-713d-46ff-b968-5437685a9727"
migrations_dir = "migrations"

[vars]
NODE_ENV = "production"
APP_URL = "https://te-slotwise.pages.dev"
RETENTION_NOTIFICATION_DAYS = "180"
RETENTION_BOOKING_DAYS = "0"
# Für Impressum und Datenschutz – bitte ausfüllen. Mehrzeilige Adresse mit | trennen.
OPERATOR_NAME = ""
OPERATOR_ADDRESS = ""
OPERATOR_EMAIL = ""
OPERATOR_PHONE = ""
