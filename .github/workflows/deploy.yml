# Veröffentlichen auf Cloudflare Pages (https://te-slotwise.pages.dev).
# Läuft bei jedem Push auf main und lässt sich unter Actions → „Deploy“ von Hand starten.
# Reihenfolge: Tests → neue Datenbank-Migrationen (D1) → Seite hochladen.
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (wie bei den anderen TE-Apps).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Typprüfung und Tests
        run: |
          npm run check
          npm test

      - name: Secrets vorhanden?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fehlt=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && fehlt="$fehlt CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && fehlt="$fehlt CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$fehlt" ]; then
            echo "::error::Fehlende Repository-Secrets:$fehlt (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Zugang zu Cloudflare prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "Token:"; api /user/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print('  gültig' if d.get('success') and d['result']['status']=='active' else '  UNGÜLTIG: '+json.dumps(d.get('errors')))" || true
          echo "Für den Token sichtbare Accounts:"
          api "/accounts?per_page=50" | python3 -c "
          import sys,json,os
          d=json.load(sys.stdin); want=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          accs=d.get('result') or []
          for a in accs: print('  -', a['name'], '(passt zur eingetragenen Account-ID)' if a['id']==want else '')
          if not accs: print('  keine –', json.dumps(d.get('errors')))
          print('Eingetragene Account-ID:', 'Länge', len(want), '– passt' if any(a['id']==want for a in accs) else '– passt zu KEINEM sichtbaren Account')
          " || true
          echo "D1-Zugriff:"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=te-slotwise-db" | python3 -c "import sys,json;d=json.load(sys.stdin);print('  ok' if d.get('success') else '  FEHLER: '+json.dumps(d.get('errors')))" || true
          echo "Pages-Zugriff:"; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/te-slotwise" | python3 -c "import sys,json;d=json.load(sys.stdin);print('  ok' if d.get('success') else '  FEHLER: '+json.dumps(d.get('errors')))" || true

      - name: Datenbank-Migrationen (D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply te-slotwise-db --remote

      - name: Seite veröffentlichen (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy --project-name te-slotwise --branch main --commit-hash "$GITHUB_SHA" --commit-message "Deploy ${GITHUB_SHA::7}"

      - name: Rauchprobe
        run: |
          sleep 15
          curl -fsS https://te-slotwise.pages.dev/healthz
          curl -fsS -o /dev/null -w "Login %{http_code}\n" https://te-slotwise.pages.dev/login
          curl -fsS -o /dev/null -w "Registrierung %{http_code}\n" https://te-slotwise.pages.dev/register
